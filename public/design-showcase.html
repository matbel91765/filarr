<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filarg 2.0 - Design Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0A0E1A;
            color: #F8FAFC;
            min-height: 100vh;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            flex-direction: column;
            gap: 24px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-top-color: #6366F1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #D946EF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            color: #94A3B8;
            font-size: 1.125rem;
        }

        #root {
            display: none;
        }

        #root.loaded {
            display: block;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <h1>Filarg 2.0 Design Showcase</h1>
        <p>Chargement des composants...</p>
    </div>

    <div id="root"></div>

    <script>
        // Attend que le DOM soit chargé
        window.addEventListener('DOMContentLoaded', () => {
            console.log('Design Showcase loading...');

            // Simule un petit délai pour montrer le loader
            setTimeout(() => {
                const loading = document.getElementById('loading');
                const root = document.getElementById('root');

                if (loading) loading.style.display = 'none';
                if (root) root.classList.add('loaded');
            }, 500);
        });
    </script>
</body>
</html>
